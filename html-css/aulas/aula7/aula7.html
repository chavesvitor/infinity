<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        /* TRANSITION BÁSICA */
        #transition {
        background-color: lightblue;
        padding: 10px;
        transition: background-color 0.5s ease;
        }

        #transition:hover {
        background-color: blue;
        color: white;
        }

        /* TRANSITION COM DELAY */
        #transition-delay {
        background-color: lightcoral;
        padding: 10px;
        transition: transform 0.5s ease 0.5s; /* duração + delay */
        }

        #transition-delay:hover {
        transform: scale(1.2);
        }

        /* ANIMAÇÃO SIMPLES */
        #animation {
        background-color: lightgreen;
        padding: 10px;
        animation: mover 100s;
        }

        @keyframes mover {
        from {
            transform: translateX(0);
        }
        to {
            transform: translateX(100px);
        }
        }

        /* ANIMAÇÃO CONTÍNUA */
        #animation-loop {
        background-color: lightyellow;
        padding: 10px;
        animation: piscar 1s infinite alternate;
        }

        @keyframes piscar {
        from {
            opacity: 1;
        }
        to {
            opacity: 0.3;
        }
        }

    </style>
</head>
<body>
    <p id="transition">Passe o mouse aqui (transição)</p>
    <p id="transition-delay">Transição com delay</p>
    <p id="animation">Animação simples</p>
    <p id="animation-loop">Animação contínua</p>
</body>
</html>
