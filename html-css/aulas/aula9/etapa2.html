<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etapa 2</title>
    <style>
        .container-flex{
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 800px;
            height: 800px;
        }
        .item-flex{
            border: 2px solid red;
            width: 400px;
            height: 400px;
            text-align: center;
            
        }
        #caixa1{
            color: green;
            width: 200px;
            height: 200px;
            background-color: black;
        }

        #caixa2{
            color: blue;
            width: 300px;
            height: 300px; 
            background-color: red;
        }
        #caixa3{
            color: darkblue;
            width: 200px;
            height: 200px;
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <div class="container-flex">
        <div class="item-flex" id="caixa1">CAIXA 1</div>
        <div class="item-flex" id="caixa2">CAIXA 2</div>
        <div class="item-flex" id="caixa3">CAIXA 3</div>
    </div>
</body>
</html>
