<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }

        @media (min-width: 1024px){
            h1{
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <h1>Paragrafo</h1>
    <p class="container">Lorem ipsum dolor sit amet consectetur adipisicing elit. Doloribus minima illum numquam, eaque voluptates reprehenderit atque enim distinctio eum architecto, saepe porro nam exercitationem ipsum dolorum, sapiente autem laboriosam! Aperiam?</p>
</body>
</html>
