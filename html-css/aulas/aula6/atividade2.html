    <style>
        .grid-container{
            display: grid;
            grid-template-areas: 
            "img01 img02 img03"

            grid-gap: 10px;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;

            text-align: center;
            border: 2px solid black;

        }

        }

            border: 2px solid black
        }

        .item6{
            grid-area: img06;
            text-align: center;
            border: 2px solid black
        }

        .item1 img:hover{
            height: 100px;
            width: auto;
        }

        transition: transform 0.3s ease;
