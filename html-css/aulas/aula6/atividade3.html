<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3</title>
    <style>
        #pseudo::before {
            content: "Início:";
            color: red;
        }
        #pseudo::after {
            content: "Fim:";
            color: red;
        }
    </style>
</head>
<body>
    <p id="pseudo">Lorem ipsum dolor sit amet consectetur adipisicing elit. </p>
</body>
</html>
