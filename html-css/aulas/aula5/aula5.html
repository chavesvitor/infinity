<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 5</title>
    <style>
        .bloco{
            background-color: cornflowerblue;
            display: block;
        }

        .linha p{
            background-color: darkolivegreen;
            display: inline;
        }

        .linhabloco{
            background-color: yellowgreen;
            display: inline-block;
        }

        .oculto{
            background-color: rgb(187, 174, 0);
            display: none;
        }

        .visivel{
            background-color: crimson;
            visibility: visible;
        }

        .invisivel{
            background-color: aquamarine;
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div class="bloco">
        <p>div em bloco</p>
    </div>
    <div class="linha">
        <p>div em linha</p>
    </div>
    <div class="linhabloco">
        <p>div em linhabloco</p>
    </div>
    <div class="oculto">
        <p>div oculta</p>
    </div>
    <div class="visivel">
        <p>oi estou invisil</p>
    </div>
    <div class="invisivel">
        <p>oi estou invisivel</p>
    </div>
</body>
</html>
