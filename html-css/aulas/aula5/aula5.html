<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 5</title>
    <style>
        .bloco{
            background-color: cornflowerblue;
            display: block;
        }

        .linha p{
            background-color: darkolivegreen;
            display: inline;
        }

        .linhabloco{
            background-color: yellowgreen;
            display: inline-block;
        }

        .oculto{
            background-color: rgb(187, 174, 0);
            display: none;
        }

        .visivel{
            background-color: crimson;
            visibility: visible;
        }

        .invisivel{
            background-color: aquamarine;
            visibility: hidden;
        }

        .static{
            position: static;            
            background-color: lightblue;            
        }

        .relative{
            background-color: chartreuse;
            position: relative;
            top: 10px;
            left: 150px;                        
        }

        .absolute p{
            background-color: blueviolet;
            position: absolute;
            top: 10px;
            right: 50px;        
        }

        .fixed{
            background-color: brown;
            position: fixed;
            top: 0;
            left: 0;
        }

        .sticky{
            background-color: palevioletred;
            position: sticky;
            bottom: 100;
        }
    </style>
</head>
<body>
    <div class="bloco">
        <p>div em bloco</p>
    </div>
    <div class="linha">
        <p>div em linha</p>
    </div>
    <div class="linhabloco">
        <p>div em linhabloco</p>
    </div>
    <div class="oculto">
        <p>div oculta</p>
    </div>
    <div class="visivel">
        <p>oi estou visivel</p>
    </div>
    <div class="invisivel">
        <p>oi estou invisivel</p>
    </div>
    <div class="static">
        <p>Método Static (padrão)</p>
    </div>
    <div class="relative">
        <p>Método Relative</p>
    </div>
    <div class="absolute">
        <p>Método Absolute</p>
    </div>
    <div class="fixed">
        <p>Método Fixed</p>
    </div>
    <div>
        <p style="height: 1000px;">Rolando a página</p>
    </div>
    <div class="sticky">
        <p>Método Sticky (grudado)</p>
    </div>
</body>
</html>
